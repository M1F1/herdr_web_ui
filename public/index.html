<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Herdr</title>
  <meta name="description" content="Your Herdr agents, on your phone.">
  <meta name="theme-color" content="#1b1e23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Herdr">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" href="/icons/favicon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <!-- Home: every agent, by what it needs from you -->
    <section id="home" class="page">
      <header class="bar home-bar">
        <div class="bar-row">
          <div class="conn" id="conn" title="herdr-core"></div>
          <div class="bar-spacer"></div>
          <button class="icon-btn" data-action="settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
        <h1 class="large-title">Agents</h1>
        <div class="summary" id="summary"></div>
        <div class="segmented" role="tablist">
          <button data-action="mode" data-mode="priority" role="tab">Priority</button>
          <button data-action="mode" data-mode="spaces" role="tab">Spaces</button>
        </div>
      </header>
      <main class="scroll" id="home-list"></main>
    </section>

    <!-- One terminal: its screen and a way to answer -->
    <section id="detail" class="page" hidden>
      <header class="bar detail-bar">
        <div class="bar-row">
          <button class="back" data-action="back" aria-label="Back">
            <svg viewBox="0 0 12 20" width="12" height="20"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Agents</span>
          </button>
          <div class="detail-title">
            <div class="dt-name" id="dt-name"></div>
            <div class="dt-sub" id="dt-sub"></div>
          </div>
          <button class="icon-btn" data-action="menu" aria-label="More">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          </button>
        </div>
        <div class="dt-status" id="dt-status"></div>
      </header>
      <main class="scroll screen-wrap" id="screen-wrap">
        <div class="screen" id="screen"></div>
      </main>
      <button class="jump" id="jump" data-action="jump" hidden aria-label="Jump to latest">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      </button>
      <footer class="composer-wrap">
        <div class="choices" id="choices" hidden></div>
        <div class="keys" id="keys"></div>
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Message" autocomplete="off" autocorrect="on" spellcheck="true" enterkeyhint="send"></textarea>
          <button type="submit" class="send" id="send" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </form>
      </footer>
    </section>

    <!-- Login, only outside Tailscale -->
    <section id="login" class="page" hidden>
      <main class="login">
        <img src="/icons/icon-192.png" alt="" width="84" height="84">
        <h1>Herdr</h1>
        <p>Paste the token the server printed when it started<br>(or run <code>npm run token</code>).</p>
        <form id="login-form">
          <input id="token" type="password" placeholder="Token" autocomplete="current-password" autocapitalize="off" autocorrect="off">
          <button type="submit">Sign in</button>
          <p class="error" id="login-error"></p>
        </form>
      </main>
    </section>
  </div>

  <!-- Sheets -->
  <div class="sheet-backdrop" id="backdrop" hidden data-action="close-sheet"></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
